# Publica uma release no GitHub quando uma tag vX.Y.Z é enviada.
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
# Tags com sufixo (v0.2.0-rc.1) viram pre-release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write     # criar a release e subir os arquivos
      id-token: write     # atestado de proveniência (Sigstore)
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable   # compila com a biblioteca padrão mais recente (correções de segurança)
          cache: false

      - name: Validar a tag
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$GITHUB_REF_NAME' não segue vMAJOR.MINOR.PATCH[-sufixo]"
            exit 1
          fi

      - name: Testes
        run: |
          go vet ./...
          go test ./...

      - name: Compilar
        env:
          CGO_ENABLED: "0"
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for target in windows/amd64 windows/arm64 linux/amd64 linux/arm64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            pkg="devpulse_${version}_${os}_${arch}"
            ext=""; [ "$os" = windows ] && ext=".exe"
            mkdir -p "build/$pkg"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${version}" \
              -o "build/$pkg/devpulse${ext}" .
            cp README.md LICENSE CHANGELOG.md "build/$pkg/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$pkg.zip" "$pkg")
            else
              tar -C build -czf "dist/$pkg.tar.gz" "$pkg"
            fi
          done
          (cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Atestar proveniência
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Notas: a seção desta versão no CHANGELOG.md; sem ela, as geradas pelo GitHub.
          awk -v v="$version" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            /^\[[^]]+\]: / { if (on) exit }
            on
          ' CHANGELOG.md > notes.md
          args=()
          if [ -s notes.md ]; then args+=(--notes-file notes.md); else args+=(--generate-notes); fi
          [[ "$version" == *-* ]] && args+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --verify-tag "${args[@]}"
